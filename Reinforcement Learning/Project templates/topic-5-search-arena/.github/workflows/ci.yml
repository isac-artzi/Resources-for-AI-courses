name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"     # pin: Box2D wheels stop at 3.13, so never 3.14

      # NOTE: CI installs the SERVING requirements plus a test runner, and
      # nothing else. If a serving module ever grows a training-tier import,
      # this step fails before the no-torch guard even runs. That is intended.
      - name: Install serving requirements only
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-serve.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check .

      - name: Test (includes the no-torch guard)
        run: pytest -q

      - name: Migration check — every migration must be checked in and ordered
        run: |
          test -d db/migrations
          ls db/migrations/*.sql
          test -f db/migrations/001_init.sql
          test -f db/migrations/002_topic5.sql

      # The serving path must be importable with NO gymnasium and NO torch.
      # requirements-serve.txt DOES list gymnasium (POST /rollout needs it), so
      # the guard above cannot catch a search agent that quietly grew a
      # gymnasium dependency. This step uninstalls it and imports the search
      # stack alone — which is the claim requirements-serve.txt makes in its
      # header comment, and an unchecked claim in a comment is a wish.
      - name: The search path imports NumPy and nothing else
        run: |
          pip uninstall -y gymnasium
          python -c "import sys; import search.agents, search.net; \
            assert 'torch' not in sys.modules, 'torch on the search path'; \
            assert 'gymnasium' not in sys.modules, 'gymnasium on the search path'; \
            from envs.connect_four import Position; \
            from search.agents import get_agent; \
            print('move', get_agent('heuristic').choose(Position()).move)"
          pip install -r requirements-serve.txt
