# Render.com blueprint for the API tier (Cloud #2).
# Dashboard -> New -> Blueprint -> point at your fork.
# After the first deploy, set SUPABASE_URL and SUPABASE_SERVICE_KEY as secret
# environment variables in the service settings (sync: false means Render will
# not read them from this file).
services:
  - type: web
    name: entityfinder-api
    runtime: python
    plan: free
    buildCommand: "pip install -r api/requirements.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: MODEL_VERSION
        value: "entityfinder-v1"
      # The review-queue cutoff. An environment variable so you can retune it
      # without a redeploy once you have seen what your reviewers are getting.
      - key: CONFIDENCE_THRESHOLD
        value: "0.85"
      - key: ALLOWED_ORIGINS
        value: "*"
