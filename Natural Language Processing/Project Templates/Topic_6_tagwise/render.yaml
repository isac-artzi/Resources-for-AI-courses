# Render.com blueprint for the API tier (Cloud #2).
# Dashboard -> New -> Blueprint -> point at your fork.
# After the first deploy, set SUPABASE_URL and SUPABASE_SERVICE_KEY as secret
# environment variables in the service settings (sync: false means Render will
# not read them from this file).
#
# A warning specific to this topic: torch and transformers are large, so the
# build is slow and the running process holds a model in memory. If the free
# plan runs out of memory when the transformer loads, your options in order of
# preference are a smaller checkpoint, loading the model lazily on first use so
# the baseline keeps answering, or a paid instance. Whichever you choose, say so
# in your README — "it worked locally" is not a deployment.
services:
  - type: web
    name: tagwise-api
    runtime: python
    plan: free
    buildCommand: "pip install -r api/requirements.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: MODEL_VERSION
        value: "tagwise-v1"
      - key: ALLOWED_ORIGINS
        value: "*"
