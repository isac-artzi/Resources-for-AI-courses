[pytest]
testpaths = tests
markers =
    contract: checks a function you must implement in api/nlp.py (fails until you do)
    network: downloads a model or a corpus; deselect with -m "not network"
    train: runs fine-tuning; slow and hardware-hungry. Deselect with -m "not train"
    cloud: needs real Supabase credentials; skipped when they are absent
