[pytest]
testpaths = tests
markers =
    contract: checks a function you must implement in api/nlp.py (fails until you do)
    network: downloads a model or tokenizer from Hugging Face; deselect with -m "not network"
    train: actually fine-tunes a decoder — slow; deselect with -m "not train"
    cloud: needs real Supabase credentials; skipped when they are absent
